[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "A LangGraph-based resume tailoring CLI and API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docxtpl>=0.17,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic>=2.10,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
]

[project.scripts]
resume-tailor = "resume_tailor.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "langgraph>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn>=0.34,<1.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=1.0,<2.0",
    "pytest>=8.3,<9.0",
    "python-dotenv>=1.0,<2.0",
    "ruff>=0.9,<1.0",
    "uvicorn>=0.34,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resume_tailor"]

[tool.hatch.build.targets.wheel.force-include]
"PROMPT.md" = "resume_tailor/PROMPT.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]